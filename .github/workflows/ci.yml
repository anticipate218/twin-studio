name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend regression tests
        run: node --test tests/*.mjs
      - name: Compile Python source
        run: python -m compileall -q server.py recon_local.py material_agent/agent tools/create_demo.py
      - name: Verify source hygiene
        run: python tools/check_release.py
